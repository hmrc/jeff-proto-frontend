include "frontend.conf"

appName="jeff-proto-frontend"

play.http.router = prod.Routes

play.http.errorHandler = "handlers.ErrorHandler"

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.AuthModule"
play.modules.enabled += "uk.gov.hmrc.mongo.play.PlayMongoModule"
play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"
# Object Store Module
play.modules.enabled += "uk.gov.hmrc.objectstore.client.play.modules.ObjectStoreModule"
play.modules.enabled += "config.Module"

play.filters.enabled += play.filters.csp.CSPFilter

play.i18n.langs = ["en", "cy"]

microservice {
    services {
      auth {
        protocol = http
        host     = localhost
        port     = 8500
      }
      internal-auth {
        protocol = http
        host     = localhost
        port     = 8470
      }
      jeff-proto-frontend {
        host = localhost
        port = 1304
      }
      upscan {
        protocol = http
        host = localhost
        port = 9570
      }
      object-store {
        host = localhost
        port = 8464
      }
      bridge-integration {
        protocol = http
        host = localhost
        port = 1300
      }
      feedback-frontend {
        protocol = http
        host     = localhost
        port     = 9514
      }

       bridge-integration {
        protocol = http
        host = localhost
        port = 1300
       }

      vmv {
       host = localhost
       port = 9301
       }

       bridge-integration-stub {
        host = "http://localhost:1303"
       }

       email-verification {
        protocol = http
        host = localhost
        port = 9891
        url {
         startEmailVerificationJourney = "/email-verification/verify-email"
         getVerifiedEmails = "/email-verification/verification-status"
            }
        }

        email-verification-frontend {
          prefix = "http://localhost:9890"
        }
    }
}

contact-frontend {
  host      = "http://localhost:9250"
  serviceId = "jeff-proto-frontend"
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

session {
  timeoutSeconds = 900
}

mongodb {
  uri                 = "mongodb://localhost:27017/"${appName}
  timeToLiveInSeconds = 900
}

urls {
  login         = "http://localhost:9949/auth-login-stub/gg-sign-in"
  loginContinue = "http://localhost:9000/jeff-proto-frontend"
  signOut       = "http://localhost:9553/bas-gateway/sign-out-without-state"
}

host = "http://localhost:1304"

accessibility-statement{
  service-path = "/jeff-proto-frontend"
}

tracking-consent-frontend {
  gtm.container = "transitional"
}

play-frontend-hmrc {
    useRebrand = true
}


features {
  welsh-translation: true
  email-verification: false
}


upscan {
      # In a deployed environment, it's important that the callback url that is sent
      # to upscan-initiate should be the internal host pattern e.g. my-service.protected.mdtp
      # This is because upscan-initiate does not send the callback over the public internet,
      # your callback endpoint should not be accessible via the public internet.
      callback-endpoint = "http://localhost:1304/internal/upscan-callback"
      upload-redirect-target-base = "http://localhost:1304"
}

sdes {
  location = "sdes-stub"
  client-id = "client-id"
  information-type = "cbc-report"
  recipient-or-sender = "cbc-reporting"
  checksum-algorithm = "SHA-256"
}

object-store.default-retention-period = 1-day

time-to-live.time = "3"
internal-auth.token = "82fac546-6de3-47bb-a1d7-357d68ecd3ac"